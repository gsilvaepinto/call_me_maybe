[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gsilvaepinto", email = "guiiilhermefspinto@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "llm-sdk",
    "numpy>=2.4.6",
    "pydantic>=2.14.2",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
]

[tool.uv]
package = false

[tool.mypy]
exclude = ["^\\.venv/", "^llm_sdk/", "^explore/"]
namespace_packages = false